<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#151419" />
  <title>Briefing enviado | EMEGE Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#151419; --text:#FBFBFB; --muted:#878787; --accent:#F56E0F; --line:rgba(251,251,251,.11); }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; font-family:"Sora",system-ui,sans-serif;
      background:radial-gradient(circle at top left,rgba(245,110,15,.18),transparent 34rem),var(--bg);
      color:var(--text); display:grid; place-items:center; padding:24px;
    }
    .card {
      width:min(760px,100%); border:1px solid var(--line); border-radius:24px;
      padding:clamp(28px,5vw,48px);
      background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.026));
      box-shadow:0 18px 52px rgba(0,0,0,.30);
    }
    img { width:min(170px,48vw); height:auto; filter:invert(1); opacity:.96; margin-bottom:34px; }
    .eyebrow { color:var(--accent); font-size:.76rem; font-weight:700; text-transform:uppercase; letter-spacing:.11em; margin-bottom:10px; }
    h1 { margin:0 0 14px; font-size:clamp(2rem,4vw,3.2rem); line-height:1.1; letter-spacing:-.035em; }
    p { margin:0 0 24px; color:rgba(251,251,251,.80); line-height:1.6; }
    a {
      display:inline-flex; align-items:center; justify-content:center; min-height:50px;
      padding:14px 20px; border-radius:999px;
      background:linear-gradient(135deg,var(--accent),#ff9a4b);
      color:#151419; font-weight:800; text-decoration:none;
    }
  </style>
</head>
<body>
  <main class="card">
    
    <div class="eyebrow">Briefing enviado</div>
    <h1>Gracias. Hemos recibido tus respuestas.</h1>
    <p>El equipo de EMEGE revisará la información y la usará para preparar una propuesta de estrategia, imagen y contenido alineada con tu marca.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
